<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <meta name="description" content="Big ambition. A clearer how. The How Company partners with ambitious company builders to unlock clarity, align their teams, and build lasting growth.">
  <title>how.co — Big ambition. A clearer how.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;450;500;550;600;650;700;750&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fbfbfd;
      --ink: #1d1d1f;
      --muted: #787881;
      --line: rgba(29, 29, 31, .1);
      --blue: #729bff;
      --purple: #a58afa;
      --pink: #e9a6d9;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --max: 1160px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-padding-top: 110px; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    body.dialog-open { overflow: hidden; }
    ::selection { background: #d9cefa; color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button, input, select, textarea { border-radius: 0; }
    button { border: 0; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-weight: 500; }
    svg { display: block; }
    a:focus-visible, button:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible {
      outline: 3px solid #9676e3;
      outline-offset: 5px;
    }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .container { width: min(var(--max), calc(100% - 96px)); margin-inline: auto; }
    .section { padding-block: 118px; }
    .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow .index { color: #aaa9b1; margin-right: 14px; font-variant-numeric: tabular-nums; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-style: italic; }
    .muted { color: var(--muted); }
    .section-title { font-size: clamp(38px, 4.5vw, 62px); letter-spacing: -.055em; line-height: 1.1; }
    .section-title .serif { letter-spacing: -.035em; font-size: 1.12em; }
    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      font-size: 13px;
      font-weight: 500;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(29,29,31,.22);
      transition: gap .35s var(--ease), border-color .3s;
    }
    .text-link:hover { gap: 21px; border-color: #9175d7; }
    .text-link .icon { width: 15px; height: 15px; }
    .button {
      min-height: 50px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 23px;
      padding: 14px 23px;
      border-radius: 100px;
      background: var(--ink);
      color: white;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      position: relative;
      transition: transform .4s var(--ease), box-shadow .4s, background .3s;
    }
    .button .icon { width: 17px; height: 17px; transition: transform .4s var(--ease); }
    .button:hover { transform: translateY(-3px); background: #323038; box-shadow: 0 8px 24px #3f315322; }
    .button:hover .icon { transform: translate(2px, -2px); }
    .button:active { transform: translateY(0); }
    .skip-link { position: fixed; top: -80px; left: 24px; z-index: 300; padding: 12px 20px; background: var(--ink); color: white; border-radius: 50px; }
    .skip-link:focus { top: 16px; }
    .scroll-spacer { display: none; }
    .is-smooth .scroll-content { position: fixed; inset: 0 0 auto; width: 100%; will-change: transform; }
    .is-smooth .scroll-spacer { display: block; pointer-events: none; }
    .js [data-reveal] {
      opacity: 0;
      transform: translateY(38px) scale(.975);
      transition: opacity 1s var(--ease), transform 1.15s var(--ease);
      transition-delay: var(--delay, 0ms);
    }
    .js [data-reveal].is-visible { opacity: 1; transform: translateY(0) scale(1); }
    .highlight { position: relative; white-space: nowrap; z-index: 0; }
    .highlight::after {
      content: "";
      position: absolute;
      height: .12em;
      left: 0;
      right: 0;
      bottom: .025em;
      background: linear-gradient(90deg, #a8c1ff, #c4a6ed 55%, #f0bedb);
      border-radius: 10px;
      z-index: -1;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 1.25s var(--ease) .4s;
    }
    .is-visible .highlight::after, .highlight.is-visible::after { transform: scaleX(1); }

    /* The floating glass navigation */
    .header {
      position: fixed;
      top: 20px;
      left: 50%;
      width: min(1280px, calc(100% - 64px));
      transform: translateX(-50%);
      z-index: 100;
      padding: 15px 22px 15px 27px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid transparent;
      border-radius: 100px;
      transition: width .65s var(--ease), top .65s var(--ease), padding .65s var(--ease), background .5s, border-color .5s, box-shadow .5s;
    }
    .header.scrolled {
      top: 12px;
      width: min(1000px, calc(100% - 48px));
      padding: 10px 12px 10px 22px;
      background: rgba(251,251,253,.76);
      border-color: rgba(255,255,255,.85);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 4px 30px rgba(33,27,62,.055), inset 0 0 0 1px rgba(29,29,31,.025);
    }
    .brand { display: inline-flex; align-items: center; gap: 13px; }
    .wordmark { font-weight: 750; font-size: 30px; line-height: 1; letter-spacing: -.075em; }
    .wordmark .co { font-weight: 450; }
    .brand-caption { font-size: 8px; font-weight: 550; letter-spacing: .09em; line-height: 1.5; text-transform: uppercase; border-left: 1px solid #d8d7dd; padding-left: 13px; }
    .desktop-nav { display: flex; gap: 31px; align-items: center; }
    .desktop-nav a { font-size: 11px; color: #66646b; transition: color .3s; position: relative; }
    .desktop-nav a:hover, .desktop-nav a.active { color: var(--ink); }
    .desktop-nav a::after { content: ""; position: absolute; bottom: -7px; left: 50%; width: 3px; height: 3px; border-radius: 50%; background: #9a7ae5; opacity: 0; transition: opacity .3s; }
    .desktop-nav a.active::after { opacity: 1; }
    .header .button { min-height: 39px; padding: 11px 18px; font-size: 10px; gap: 22px; }
    .header .button .icon { width: 14px; height: 14px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .menu-toggle { display: none; width: 39px; height: 39px; border-radius: 50%; background: #eeeef3; align-items: center; justify-content: center; flex-direction: column; gap: 5px; }
    .menu-toggle span { height: 1px; width: 15px; background: var(--ink); transition: transform .3s; }
    .menu-toggle[aria-expanded="true"] span:first-child { transform: translateY(3px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span:last-child { transform: translateY(-3px) rotate(-45deg); }
    .mobile-nav { display: none; }

    /* A quiet, living gradient */
    .hero { position: relative; isolation: isolate; text-align: center; padding: 170px 24px 34px; overflow: hidden; }
    .hero-atmosphere { position: absolute; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
    .mesh-blob {
      position: absolute;
      top: 230px;
      left: calc(50% - 410px);
      width: 820px;
      height: 490px;
      background:
        radial-gradient(ellipse at 25% 45%, #9ecbff 0%, transparent 54%),
        radial-gradient(ellipse at 65% 30%, #c8b4fb 0%, transparent 58%),
        radial-gradient(ellipse at 80% 75%, #f5c2da 0%, transparent 57%),
        radial-gradient(ellipse at 45% 80%, #c5c2ff 0%, transparent 60%);
      filter: blur(48px);
      opacity: .7;
      border-radius: 44% 56% 68% 32% / 50% 36% 64% 50%;
      animation: morph 19s ease-in-out infinite alternate, hue-drift 28s ease-in-out infinite alternate;
    }
    .mesh-light { position: absolute; top: 185px; left: calc(50% - 230px); width: 450px; height: 450px; background: radial-gradient(ellipse, rgba(255,255,255,.95), transparent 65%); filter: blur(20px); }
    .mesh-orbit { position: absolute; top: 314px; left: calc(50% - 410px); width: 820px; height: 365px; border: 1px solid rgba(255,255,255,.6); border-radius: 50%; transform: rotate(-16deg); box-shadow: 0 0 20px rgba(255,255,255,.22); }
    .mesh-orbit.two { top: 370px; left: calc(50% - 340px); width: 700px; height: 240px; transform: rotate(17deg); opacity: .5; }
    .hero-eyebrow { display: inline-flex; align-items: center; gap: 9px; border: 1px solid #e8e5ee; background: rgba(255,255,255,.58); border-radius: 50px; padding: 6px 12px; font-size: 9px; font-weight: 500; letter-spacing: .055em; }
    .status-dot { position: relative; width: 5px; height: 5px; border-radius: 50%; background: #a389d6; flex-shrink: 0; }
    .status-dot::after { content: ""; position: absolute; inset: -4px; border: 1px solid #b9a6e4; border-radius: 50%; animation: pulse 3s ease-out infinite; }
    .hero h1 { font-size: clamp(72px, 8.7vw, 118px); line-height: 1.025; letter-spacing: -.07em; font-weight: 500; margin-top: 25px; }
    .hero h1 .serif { font-size: 1.14em; line-height: .8; letter-spacing: -.065em; padding-right: .05em; }
    .gradient-type { background: linear-gradient(115deg, #5485d5 5%, #9679cc 52%, #c985b5 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero-description { font-size: 15px; color: #71707a; line-height: 1.85; max-width: 460px; margin: 25px auto 0; letter-spacing: -.015em; }
    .hero-actions { display: flex; justify-content: center; align-items: center; gap: 27px; margin-top: 27px; }
    .hero-actions .secondary { font-size: 11px; display: inline-flex; gap: 9px; align-items: center; color: #595660; transition: color .3s; }
    .hero-actions .secondary:hover { color: #8959bd; }
    .hero-actions .secondary .icon { width: 14px; height: 14px; }
    .signal-map { width: min(750px, 100%); height: 155px; position: relative; margin: 32px auto 0; }
    .signal-path { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .signal-path .travel { stroke-dasharray: 2 700; animation: travel 8s linear infinite; }
    .hero-chip {
      position: absolute;
      top: 61px;
      width: 176px;
      padding: 16px 17px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: linear-gradient(135deg, rgba(255,255,255,.83), rgba(255,255,255,.48));
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 17px;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 35px #6b55880b, inset 0 1px 0 white;
      animation: levitate 7s ease-in-out infinite;
    }
    .hero-chip.one { left: 20px; transform: rotate(-5deg); }
    .hero-chip.two { top: 25px; left: calc(50% - 88px); animation-delay: -2.2s; }
    .hero-chip.three { right: 20px; transform: rotate(5deg); animation-delay: -4.5s; }
    .chip-symbol { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; color: #7d9bdd; background: #e9f0fd; flex-shrink: 0; }
    .two .chip-symbol { background: #eee8fa; color: #a188d1; }
    .three .chip-symbol { background: #f9eaf3; color: #cc99ba; }
    .chip-symbol .icon { width: 18px; height: 18px; }
    .chip-number { display: block; color: #9996a2; font-size: 8px; letter-spacing: .08em; line-height: 1.5; margin-bottom: 2px; }
    .chip-label { font-size: 11px; font-weight: 500; white-space: nowrap; }
    .hero-footnote { margin-top: 17px; color: #929099; font-size: 9px; letter-spacing: .055em; }
    .hero-footnote span { display: inline-block; margin-inline: 8px; width: 2px; height: 2px; background: #aaa5b2; vertical-align: middle; }
    .builder-strip { padding: 40px 0 43px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 30px; }
    .builder-strip > p { color: #9b99a1; font-size: 10px; line-height: 1.7; max-width: 160px; }
    .builder-types { display: flex; gap: clamp(32px, 6vw, 83px); color: #727077; font-size: 17px; letter-spacing: -.045em; font-weight: 550; }
    .builder-types span { display: flex; align-items: center; gap: 12px; }
    .builder-types .icon { width: 19px; height: 19px; color: #a7a3ae; stroke-width: 1.25; }

    /* The philosophy */
    .approach { padding-bottom: 104px; }
    .approach-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 100px; margin-top: 33px; align-items: center; }
    .approach .section-title { max-width: 600px; }
    .approach-copy { padding-top: 4px; }
    .approach-copy p { color: var(--muted); font-size: 14px; line-height: 1.9; }
    .approach-copy p + p { margin-top: 16px; }
    .approach-copy .text-link { margin-top: 24px; }
    .principle-line { display: flex; align-items: center; gap: 14px; margin-top: 56px; }
    .principle-line::before { content: ""; width: 27px; height: 1px; background: linear-gradient(90deg, #8fb9ef, #bc8cda, #e9b2d0); }
    .principle-line p { color: #939099; font-size: 10px; letter-spacing: .025em; }

    /* The four connected growth disciplines */
    .pillars { background: #f3f3f7; position: relative; padding-top: 105px; padding-bottom: 110px; border-top: 1px solid #eeeeF3; border-bottom: 1px solid #eeeeF3; }
    .section-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 60px; margin-bottom: 56px; }
    .section-heading .section-title { margin-top: 25px; }
    .section-heading > p { font-size: 13px; color: var(--muted); max-width: 265px; line-height: 1.9; padding-bottom: 5px; }
    .pillars-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding-bottom: 76px; }
    .pillar-slot:nth-child(even) { transform: translateY(76px); }
    .pillar-card { border-radius: 25px; background: #fff; padding: 28px 31px 30px; border: 1px solid rgba(255,255,255,.95); box-shadow: 0 4px 16px rgba(31,27,51,.025); min-height: 468px; position: relative; overflow: hidden; transition: box-shadow .5s var(--ease), transform .5s var(--ease); }
    .pillar-card:hover { box-shadow: 0 18px 60px #50436b0c; }
    .pillar-top { display: flex; align-items: center; justify-content: space-between; }
    .pillar-number { font-size: 9px; color: #aaa6b2; letter-spacing: .08em; }
    .pillar-tag { color: #a39baF; font-size: 8px; letter-spacing: .13em; text-transform: uppercase; }
    .pillar-visual { height: 226px; position: relative; display: grid; place-items: center; margin: 1px -15px 0; }
    .pillar-card h3 { font-size: 24px; line-height: 1.2; letter-spacing: -.045em; }
    .pillar-card .pillar-description { color: #89858e; font-size: 12px; line-height: 1.85; max-width: 340px; margin-top: 12px; padding-right: 10px; }
    .pillar-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 23px; }
    .pillar-bottom > span { color: #aaa5b1; font-size: 8px; letter-spacing: .08em; }
    .circle-button { height: 31px; width: 31px; border: 1px solid #e9e6ee; border-radius: 50%; background: transparent; display: grid; place-items: center; transition: background .3s, transform .4s var(--ease), border-color .3s; }
    .circle-button .icon { width: 13px; height: 13px; }
    .circle-button:hover { background: #eeE8fa; border-color: #dcd0f0; transform: rotate(90deg); }
    .visual-glow { position: absolute; width: 190px; height: 160px; border-radius: 50%; filter: blur(26px); background: #e4eafa; opacity: .6; }
    .orbit-system { position: relative; width: 174px; height: 174px; display: grid; place-items: center; }
    .orbit-ring { position: absolute; border: 1px solid #dbe3f4; border-radius: 50%; inset: 0; }
    .orbit-ring.inner { inset: 25px; border-color: #d9dff0; }
    .orbit-ring.outer { inset: -24px; border-style: dashed; opacity: .4; }
    .orbit-center { width: 57px; height: 57px; border-radius: 50%; background: linear-gradient(150deg, white, #e5eafc); border: 1px solid white; display: grid; place-items: center; box-shadow: 0 5px 20px #8c9ecf20, inset 0 2px 4px white; color: #8293bc; }
    .orbit-center .icon { width: 23px; height: 23px; stroke-width: 1.2; }
    .orbit-traveler { position: absolute; inset: 0; animation: spin 22s linear infinite; }
    .orbit-traveler::before { content: ""; position: absolute; width: 9px; height: 9px; top: -4px; left: calc(50% - 4px); border-radius: 50%; background: linear-gradient(135deg, #b5cdfc, #7d9cd9); box-shadow: 0 0 0 5px #fff9, 0 0 12px #a8bbf55c; }
    .orbit-traveler.alt { inset: 25px; animation-duration: 16s; animation-direction: reverse; }
    .orbit-traveler.alt::before { width: 7px; height: 7px; background: #b9a5de; }
    .micro-label { position: absolute; padding: 7px 11px; font-size: 8px; background: #ffffffde; border: 1px solid white; border-radius: 7px; box-shadow: 0 5px 20px #46355d07; color: #8b859c; letter-spacing: .015em; white-space: nowrap; }
    .coaching-label { bottom: 29px; right: calc(50% - 138px); transform: rotate(-5deg); }
    .alignment-visual .visual-glow { background: #eee1fb; }
    .alignment-network { position: relative; width: 292px; height: 170px; }
    .alignment-network > svg { position: absolute; width: 100%; height: 100%; }
    .alignment-node { position: absolute; display: flex; align-items: center; gap: 7px; font-size: 8px; color: #93839e; background: #ffffffe8; border: 1px solid #f0e7f8; padding: 8px 12px; border-radius: 8px; box-shadow: 0 3px 12px #85739506; }
    .alignment-node::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: #bba0d8; animation: node-pulse 4s ease-in-out infinite; }
    .alignment-node.n1 { top: 9px; left: 10px; }
    .alignment-node.n2 { bottom: 13px; left: 22px; }
    .alignment-node.n2::before { animation-delay: -1.3s; }
    .alignment-node.n3 { right: 0; top: 70px; }
    .alignment-node.n3::before { animation-delay: -2.6s; }
    .alignment-hub { position: absolute; top: 56px; left: 112px; width: 57px; height: 57px; display: grid; place-items: center; color: #a58bbc; border: 1px solid #fff; background: linear-gradient(135deg, #fdfaff, #e7d8f6); border-radius: 17px; box-shadow: 0 5px 20px #baa4ce25; }
    .alignment-hub::after { content: ""; position: absolute; inset: -12px; border: 1px solid #e9def3; border-radius: 25px; animation: hub-pulse 4s ease-in-out infinite; }
    .revenue-visual .visual-glow { background: #e4e4fc; width: 245px; }
    .chart { position: relative; width: 285px; height: 156px; }
    .chart > svg { width: 100%; height: 100%; overflow: visible; }
    .chart-line { stroke-dasharray: 330; stroke-dashoffset: 330; animation: draw-chart 6s var(--ease) infinite; }
    .chart-end { animation: node-pulse 3s ease-in-out infinite; }
    .chart-tag { top: -7px; right: -2px; padding: 6px 9px; display: flex; align-items: center; gap: 6px; color: #9485bf; }
    .chart-tag .icon { width: 11px; height: 11px; }
    .chart-caption { position: absolute; bottom: -15px; left: 1px; right: 0; display: flex; justify-content: space-between; font-size: 7px; color: #aaa2b6; letter-spacing: .06em; }
    .market-visual .visual-glow { background: #fae4ef; }
    .globe { width: 165px; height: 165px; position: relative; }
    .globe > svg { width: 100%; height: 100%; }
    .globe-point { position: absolute; top: 41px; right: 40px; width: 7px; height: 7px; background: #d6a2bd; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 0 1px #dbb0c8; }
    .globe-point::after { content: ""; position: absolute; inset: -8px; border: 1px solid #d8a8c5; border-radius: 50%; animation: pulse 3s ease-out infinite; }
    .globe-point.second { top: 102px; right: 96px; width: 5px; height: 5px; opacity: .6; }
    .globe-point.second::after { animation-delay: -1.5s; }
    .market-label { right: calc(50% - 144px); bottom: 39px; transform: rotate(5deg); display: flex; gap: 7px; align-items: center; }
    .market-label .icon { width: 12px; height: 12px; }
    .pillars-note { text-align: center; margin-top: 49px; display: flex; gap: 9px; align-items: center; justify-content: center; font-size: 10px; color: #929099; }
    .pillars-note .icon { width: 13px; height: 13px; color: #9f8bbd; }

    /* A horizontal, scroll-opened window */
    .perspective { padding-bottom: 102px; }
    .perspective-intro { text-align: center; }
    .perspective-intro .section-title { margin-top: 26px; font-size: clamp(36px, 4.3vw, 58px); }
    .perspective-intro > p { font-size: 13px; color: var(--muted); margin-top: 22px; }
    .canvas-window { --open: 1; position: relative; height: 445px; margin-top: 55px; border-radius: 25px; overflow: hidden; isolation: isolate; }
    .js .canvas-window { --open: 0; }
    .canvas-scene { position: absolute; inset: 0; background: #171724; overflow: hidden; transform: translateX(calc((1 - var(--open)) * 35px)) scale(calc(1.05 - var(--open) * .05)); }
    .canvas-aura { position: absolute; width: 780px; height: 600px; right: -170px; top: -160px; background: radial-gradient(ellipse at 35% 25%, #698dcd55, transparent 45%), radial-gradient(ellipse at 55% 55%, #b98dba42, transparent 50%), radial-gradient(ellipse at 75% 85%, #ccb5df20, transparent 50%); filter: blur(35px); animation: canvas-breathe 12s ease-in-out infinite alternate; }
    .canvas-top { position: absolute; z-index: 2; inset: 31px 34px auto; display: flex; justify-content: space-between; color: #d2cfdc; }
    .canvas-brand { font-weight: 600; font-size: 17px; letter-spacing: -.06em; }
    .canvas-top .eyebrow { font-size: 8px; font-weight: 400; color: #a8a2b7; padding-top: 6px; }
    .growth-path { position: absolute; width: 110%; height: 100%; bottom: -3%; left: 0; }
    .growth-path .path-light { stroke-dasharray: 3 1200; animation: pathway 11s linear infinite; }
    .canvas-copy { position: absolute; bottom: 47px; left: 46px; z-index: 2; }
    .canvas-copy p { color: #a5a0b5; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
    .canvas-copy h3 { color: #f8f5ff; font-size: clamp(37px, 4vw, 54px); line-height: 1.1; letter-spacing: -.05em; }
    .canvas-copy h3 .serif { color: #d1bade; font-size: 1.12em; }
    .canvas-coordinate { position: absolute; right: 34px; bottom: 28px; display: flex; align-items: center; gap: 8px; color: #a8a0b7; font-size: 8px; letter-spacing: .03em; }
    .canvas-coordinate .status-dot { background: #c5b0e2; width: 4px; height: 4px; }
    .canvas-coordinate .status-dot::after { display: none; }
    .canvas-curtain { position: absolute; top: -1px; bottom: -1px; width: calc(50% + 1px); z-index: 5; background: var(--paper); pointer-events: none; }
    .canvas-curtain.left { left: -1px; transform: translateX(calc(var(--open) * -101%)); }
    .canvas-curtain.right { right: -1px; transform: translateX(calc(var(--open) * 101%)); }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 55px; }
    .stat { padding: 0 45px; border-left: 1px solid var(--line); }
    .stat:first-child { padding-left: 0; border-left: 0; }
    .stat:last-child { padding-right: 0; }
    .stat-number { font-size: 57px; line-height: 1.1; font-weight: 450; letter-spacing: -.055em; display: flex; align-items: baseline; }
    .odometer { display: inline-flex; height: 1.1em; overflow: hidden; vertical-align: bottom; }
    .digit-window { width: .65em; height: 1.1em; overflow: hidden; }
    .digit-reel { display: flex; flex-direction: column; transition: transform 2s var(--ease); will-change: transform; }
    .digit-reel span { height: 1.1em; line-height: 1.1em; text-align: left; flex-shrink: 0; }
    .stat-suffix { margin-left: 8px; color: #aaa3b5; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 28px; font-weight: 400; letter-spacing: -.02em; }
    .stat h3 { font-size: 12px; font-weight: 500; margin-top: 12px; letter-spacing: -.015em; }
    .stat p { font-size: 10px; color: #96909f; margin-top: 5px; line-height: 1.8; }

    /* A partnership, not a presentation */
    .partnership { border-top: 1px solid var(--line); padding-top: 100px; }
    .partnership-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 100px; margin-top: 31px; }
    .partnership-left .section-title { font-size: clamp(36px, 4.2vw, 56px); }
    .partnership-left > p { color: var(--muted); font-size: 13px; line-height: 1.9; max-width: 340px; margin-top: 22px; }
    .process-tabs { display: flex; flex-direction: column; gap: 0; margin-top: 37px; max-width: 390px; }
    .process-tab { text-align: left; width: 100%; background: transparent; display: flex; align-items: center; gap: 18px; padding: 19px 0; border-bottom: 1px solid var(--line); color: #9b97a2; transition: color .3s; }
    .process-tab:first-child { border-top: 1px solid var(--line); }
    .process-tab > span:first-child { font-size: 9px; font-variant-numeric: tabular-nums; }
    .process-tab .tab-label { font-size: 13px; font-weight: 500; flex: 1; }
    .process-tab .icon { width: 15px; height: 15px; opacity: 0; transform: translateX(-8px); transition: opacity .3s, transform .4s var(--ease); }
    .process-tab[aria-selected="true"] { color: var(--ink); }
    .process-tab[aria-selected="true"] > span:first-child { color: #a388c4; }
    .process-tab[aria-selected="true"] .icon { opacity: 1; transform: translateX(0); }
    .process-tab:hover { color: #6e558e; }
    .process-panel { align-self: center; position: relative; border-radius: 26px; padding: 29px 35px 34px; background: linear-gradient(145deg, #f3f3f8, #f8f5fb 70%, #fbf6f9); border: 1px solid #eeebf2; min-height: 458px; overflow: hidden; }
    .process-panel-top { display: flex; justify-content: space-between; align-items: center; font-size: 8px; color: #aca4b5; letter-spacing: .1em; }
    .process-panel-top .icon { width: 14px; height: 14px; color: #b0a5c0; }
    .process-art { height: 200px; position: relative; display: grid; place-items: center; }
    .focus-rings { width: 125px; height: 125px; position: relative; display: grid; place-items: center; transition: transform 1s var(--ease); }
    .focus-rings::before, .focus-rings::after { content: ""; position: absolute; border: 1px solid #d8cfe5; border-radius: 29px; inset: 0; transform: rotate(-12deg); transition: transform 1s var(--ease), border-radius 1s var(--ease); }
    .focus-rings::after { transform: rotate(12deg); inset: 13px; border-color: #d7cae4; background: #ffffff21; }
    .focus-core { width: 65px; height: 65px; border-radius: 20px; display: grid; place-items: center; position: relative; z-index: 1; border: 1px solid #fff; background: linear-gradient(145deg, #fff, #e1d7ec); box-shadow: 0 10px 35px #9c87b11b, inset 0 1px 5px white; }
    .focus-core .icon { width: 26px; height: 26px; color: #a395b5; stroke-width: 1.1; }
    .process-orbit-dot { position: absolute; width: 6px; height: 6px; background: #c2b0d7; border: 1px solid white; border-radius: 50%; top: 25px; right: 4px; box-shadow: 0 0 0 5px #fff5; transition: transform 1s var(--ease); }
    .process-panel[data-step="1"] .focus-rings::before { transform: rotate(45deg); border-radius: 38px; }
    .process-panel[data-step="1"] .focus-rings::after { transform: rotate(-45deg); border-radius: 30px; }
    .process-panel[data-step="1"] .process-orbit-dot { transform: translate(-110px, 68px); }
    .process-panel[data-step="2"] .focus-rings::before { transform: rotate(90deg); border-radius: 50%; }
    .process-panel[data-step="2"] .focus-rings::after { transform: rotate(-90deg); border-radius: 50%; }
    .process-panel[data-step="2"] .process-orbit-dot { transform: translate(-60px, -35px); }
    .process-panel h3 { font-size: 25px; letter-spacing: -.045em; line-height: 1.2; }
    .process-panel .process-description { font-size: 12px; line-height: 1.85; color: #89818f; margin-top: 13px; }
    .process-outcome { display: flex; gap: 8px; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #e4dfeb; color: #92869e; font-size: 9px; }
    .process-outcome .icon { width: 12px; height: 12px; }
    .process-content { transition: opacity .2s, transform .3s var(--ease); }
    .process-content.switching { opacity: 0; transform: translateY(7px); }

    /* The invitation */
    .invitation { position: relative; overflow: hidden; text-align: center; padding: 117px 24px 133px; border-top: 1px solid var(--line); isolation: isolate; }
    .invitation-glow { position: absolute; z-index: -1; width: 800px; height: 350px; left: calc(50% - 400px); bottom: -100px; background: radial-gradient(ellipse at 22% 45%, #d2e0ff 0%, transparent 55%), radial-gradient(ellipse at 65% 35%, #e4dafa 0%, transparent 60%), radial-gradient(ellipse at 85% 65%, #f4d8e6 0%, transparent 55%); filter: blur(55px); opacity: .8; }
    .invitation .eyebrow { color: #96919d; font-size: 9px; }
    .invitation h2 { font-size: clamp(46px, 6vw, 80px); line-height: 1.08; letter-spacing: -.06em; margin-top: 27px; }
    .invitation h2 .serif { font-size: 1.09em; letter-spacing: -.045em; }
    .invitation > div > p { font-size: 12px; color: #8a8492; margin-top: 23px; }
    .reflected-cta { position: relative; display: inline-block; margin-top: 30px; }
    .reflected-cta .button { min-width: 208px; }
    .cta-reflection { position: absolute; top: calc(100% + 5px); left: 0; right: 0; transform: scaleY(-1); pointer-events: none; opacity: .12; mask-image: linear-gradient(to top, #000 0%, transparent 76%); -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 76%); }
    .invitation .email-link { display: block; width: fit-content; margin: 52px auto 0; font-size: 10px; color: #8c8595; transition: color .3s; }
    .invitation .email-link:hover { color: var(--ink); }
    .footer { padding: 33px 0 27px; border-top: 1px solid var(--line); }
    .footer-main { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
    .footer .wordmark { font-size: 28px; }
    .footer-note { font-size: 9px; color: #8a8491; margin-left: 21px; letter-spacing: .02em; }
    .footer-brand { display: flex; align-items: center; }
    .back-top { display: inline-flex; align-items: center; gap: 12px; font-size: 9px; color: #89838f; }
    .back-top .icon { width: 12px; height: 12px; }
    .footer-bottom { display: flex; justify-content: space-between; margin-top: 28px; font-size: 8px; color: #aaa4af; }
    .footer-bottom button { background: transparent; padding: 0; font-size: 8px; color: inherit; }
    .footer-bottom button:hover { color: var(--ink); }
    .footer-bottom-right { display: flex; gap: 24px; }

    /* Real, lightweight conversations */
    dialog {
      width: min(540px, calc(100% - 32px));
      max-height: calc(100dvh - 48px);
      border: 1px solid #fff;
      border-radius: 25px;
      background: #fbfbfd;
      color: var(--ink);
      padding: 37px;
      box-shadow: 0 25px 100px #211b4030;
      overflow-y: auto;
    }
    dialog::backdrop { background: rgba(28,24,42,.25); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    dialog[open] { animation: modal-in .4s var(--ease); }
    .dialog-close { position: absolute; top: 19px; right: 19px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #eeecf3; color: #7d748a; }
    .dialog-close .icon { width: 13px; height: 13px; }
    .dialog-eyebrow { font-size: 8px; color: #9b8cae; letter-spacing: .12em; text-transform: uppercase; margin: 3px 0 17px; }
    dialog h2 { font-size: 36px; font-weight: 500; line-height: 1.12; letter-spacing: -.055em; padding-right: 14px; }
    dialog .dialog-intro { font-size: 12px; line-height: 1.85; color: var(--muted); margin: 15px 0 23px; }
    .contact-form { display: grid; gap: 15px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 10px; font-weight: 500; color: #706779; }
    .field label span { font-weight: 400; color: #aaa1b0; }
    .field input, .field select, .field textarea { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid #e4dfe9; border-radius: 9px; background: white; color: var(--ink); font-size: 12px; transition: border-color .3s; }
    .field input:hover, .field select:hover, .field textarea:hover { border-color: #c1afd5; }
    .field input::placeholder, .field textarea::placeholder { color: #b2aab9; }
    .field textarea { resize: vertical; min-height: 82px; }
    .contact-form .button { margin-top: 3px; width: 100%; }
    .form-note { font-size: 9px; line-height: 1.7; text-align: center; color: #a49aaa; }
    .form-status { font-size: 11px; color: #756083; padding: 13px; border-radius: 9px; background: #eee8f5; }
    .form-status[hidden] { display: none; }
    .service-list { list-style: none; padding: 0; margin: 26px 0; display: grid; gap: 15px; }
    .service-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; color: #7a7283; }
    .service-list .icon { width: 14px; height: 14px; margin-top: 3px; color: #a38cbe; }
    .service-fit { border-top: 1px solid var(--line); padding-top: 19px; margin-bottom: 25px; font-size: 11px; color: #93889e; }
    #privacy-dialog p:not(.dialog-eyebrow) { font-size: 12px; color: var(--muted); line-height: 1.9; margin-top: 19px; }

    @keyframes morph {
      0% { border-radius: 44% 56% 68% 32% / 50% 36% 64% 50%; transform: translate(-25px, 5px) rotate(-10deg) scale(.97); }
      50% { border-radius: 65% 35% 42% 58% / 39% 57% 43% 61%; transform: translate(20px, -12px) rotate(5deg) scale(1.05); }
      100% { border-radius: 38% 62% 54% 46% / 66% 32% 68% 34%; transform: translate(10px, 20px) rotate(12deg) scale(1); }
    }
    @keyframes hue-drift { from { filter: blur(48px) hue-rotate(-8deg); } to { filter: blur(48px) hue-rotate(13deg); } }
    @keyframes pulse { 0% { transform: scale(.5); opacity: .75; } 80%, 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes node-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes hub-pulse { 0%, 100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.04); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes levitate { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
    @keyframes travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -702; } }
    @keyframes draw-chart { 0% { stroke-dashoffset: 330; opacity: 0; } 12% { opacity: 1; } 62%, 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes pathway { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1203; } }
    @keyframes canvas-breathe { from { transform: translate(-10px, -10px) scale(.95); } to { transform: translate(25px, 15px) scale(1.1); } }
    @keyframes modal-in { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

    @media (min-width: 1600px) {
      .hero { padding-top: 195px; padding-bottom: 50px; }
      .hero h1 { font-size: 126px; }
      .signal-map { margin-top: 45px; }
    }
    @media (max-width: 1100px) {
      .container { width: calc(100% - 72px); }
      .header { width: calc(100% - 42px); }
      .brand-caption { display: none; }
      .approach-grid { gap: 55px; }
      .partnership-grid { gap: 55px; }
      .pillar-card { padding: 25px; }
      .builder-types { gap: 34px; font-size: 15px; }
      .stat { padding-inline: 32px; }
    }
    @media (max-width: 800px) {
      .container { width: calc(100% - 48px); }
      .section { padding-block: 80px; }
      .desktop-nav { gap: 23px; }
      .desktop-nav a { font-size: 10px; }
      .hero { padding-top: 157px; }
      .hero h1 { font-size: 87px; }
      .hero-description { font-size: 14px; }
      .hero-chip { width: 161px; padding: 14px; }
      .hero-chip.two { left: calc(50% - 80px); }
      .hero-chip.one { left: 7px; }
      .hero-chip.three { right: 7px; }
      .chip-label { font-size: 10px; }
      .builder-strip { padding-block: 30px; }
      .builder-strip > p { max-width: 125px; font-size: 9px; }
      .builder-types { gap: 22px; font-size: 12px; }
      .builder-types span { gap: 7px; }
      .builder-types .icon { width: 15px; height: 15px; }
      .approach-grid { gap: 35px; grid-template-columns: 1.15fr 1fr; }
      .approach-copy p { font-size: 12px; }
      .section-heading { gap: 35px; margin-bottom: 40px; }
      .section-heading > p { max-width: 215px; font-size: 12px; }
      .pillars-grid { gap: 18px; padding-bottom: 55px; }
      .pillar-slot:nth-child(even) { transform: translateY(55px); }
      .pillar-card { padding: 23px; min-height: 455px; border-radius: 21px; }
      .pillar-card h3 { font-size: 22px; }
      .pillar-visual { height: 218px; transform: scale(.86); margin-inline: -25px; }
      .pillar-card .pillar-description { font-size: 11px; padding-right: 0; }
      .pillar-bottom { margin-top: 19px; }
      .pillar-tag { font-size: 7px; }
      .pillar-bottom > span { font-size: 7px; }
      .canvas-window { height: 390px; }
      .canvas-copy { left: 32px; bottom: 40px; }
      .stat { padding-inline: 24px; }
      .stat-number
