<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="description" content="The How Company is a strategic growth partner for ambitious company builders. Align your people, unlock your growth engine, and build what comes next.">
  <title>how.co — Ambition, accelerated.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0c0c0e;
      --bone: #eeece5;
      --muted: #8c8b88;
      --orange: #ff6436;
      --red: #df3d22;
      --line: rgba(238, 236, 229, .15);
      --display: "Syne", sans-serif;
      --serif: "Newsreader", Georgia, serif;
      --mono: "IBM Plex Mono", monospace;
      --gutter: clamp(22px, 4.4vw, 80px);
      --header-height: 88px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 30px; }
    body { margin: 0; background: var(--ink); color: var(--bone); font-family: var(--display); -webkit-font-smoothing: antialiased; }
    body.modal-open { overflow: hidden; }
    ::selection { background: var(--orange); color: var(--ink); }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button, input, select, textarea { border-radius: 0; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 6px;
    }
    img { max-width: 100%; display: block; }
    h1, h2, h3, p { margin: 0; }
    svg.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; flex-shrink: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .skip-link { position: fixed; top: 12px; left: 12px; z-index: 100; padding: 12px 20px; background: var(--bone); color: var(--ink); transform: translateY(-150%); }
    .skip-link:focus { transform: translateY(0); }
    .eyebrow { font: 400 10px/1.6 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .serif { font-family: var(--serif); font-weight: 400; font-style: italic; }
    .orange { color: var(--orange); }
    .section-tag { display: flex; align-items: baseline; gap: 20px; }
    .section-tag .number { color: var(--orange); }
    .section-tag .dash { width: 30px; height: 1px; background: var(--line); align-self: center; }
    .text-link { display: inline-flex; align-items: center; gap: 22px; padding: 13px 0; border-bottom: 1px solid var(--orange); font-size: 13px; font-weight: 600; }
    .text-link .icon { width: 16px; height: 16px; transition: transform .3s; }
    .text-link:hover .icon { transform: translate(3px, -3px); }
    .round-arrow { display: grid; place-items: center; width: 45px; height: 45px; border: 1px solid var(--line); border-radius: 50%; transition: background .3s, color .3s, border-color .3s; }
    .grain { position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: .035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.55' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
    .site-header { height: var(--header-height); padding: 0 var(--gutter); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
    .brand-wrap { display: flex; align-items: center; gap: 27px; }
    .brand { font-size: 33px; font-weight: 800; letter-spacing: -.065em; line-height: 1; }
    .brand .brand-dot { color: var(--orange); }
    .brand-tag { border-left: 1px solid var(--line); padding-left: 25px; font-size: 8px; line-height: 1.7; letter-spacing: .12em; color: #aaa8a3; }
    .desktop-nav { display: flex; align-items: center; gap: 38px; }
    .desktop-nav > a { font-size: 11px; transition: color .2s; }
    .desktop-nav > a:hover { color: var(--orange); }
    .header-cta { display: flex; align-items: center; gap: 28px; background: transparent; border: 1px solid #6d6b65; padding: 13px 18px; font-size: 11px; transition: background .25s, border-color .25s, color .25s; }
    .header-cta .icon { width: 15px; height: 15px; }
    .header-cta:hover { background: var(--bone); border-color: var(--bone); color: var(--ink); }
    .mobile-toggle { display: none; background: none; border: 1px solid var(--line); width: 43px; height: 43px; align-items: center; justify-content: center; flex-direction: column; gap: 6px; }
    .mobile-toggle span { display: block; width: 17px; height: 1px; background: var(--bone); transition: transform .25s; }
    .mobile-toggle[aria-expanded="true"] span:first-child { transform: translateY(3.5px) rotate(45deg); }
    .mobile-toggle[aria-expanded="true"] span:last-child { transform: translateY(-3.5px) rotate(-45deg); }
    .mobile-nav { display: none; }

    /* Scene 00 — the ignition */
    .hero { min-height: calc(100svh - var(--header-height)); padding: 30px var(--gutter) 0; position: relative; overflow: hidden; display: flex; flex-direction: column; isolation: isolate; }
    .hero-atmosphere { position: absolute; inset: -12% -5%; z-index: -3; overflow: hidden; transform: translate3d(0, var(--hero-parallax, 0px), 0); background: radial-gradient(ellipse at 74% 46%, rgba(160, 46, 19, .25), transparent 53%); }
    .light-ray { position: absolute; width: 120%; height: 28%; left: 10%; top: 25%; transform-origin: 70% 50%; filter: blur(45px); mix-blend-mode: screen; background: linear-gradient(90deg, transparent 25%, rgba(255, 59, 11, .08) 49%, rgba(255, 110, 36, .32) 75%, transparent); transform: rotate(-28deg); animation: ray-drift 19s ease-in-out infinite alternate; }
    .light-ray.two { top: 43%; left: 3%; height: 13%; filter: blur(25px); opacity: .6; animation-duration: 24s; animation-direction: alternate-reverse; }
    .hero-orbit { position: absolute; width: 64vw; height: 64vw; max-width: 940px; max-height: 940px; right: -11%; top: 16%; border-radius: 50%; transform: rotate(-30deg); background: radial-gradient(circle at 50% 49%, #0d0c0e 63%, #1d0e0c 65%, #e84e1d 67%, #ffb57c 67.35%, #ff692d 67.65%, rgba(202, 53, 12, .35) 68.5%, transparent 72%); opacity: .8; box-shadow: inset 0 0 100px 50px #0c0c0e; }
    .hero-orbit::after { content: ""; position: absolute; inset: -10%; border-radius: 50%; background: conic-gradient(from -50deg, #0c0c0e 0deg, transparent 70deg, transparent 100deg, #0c0c0e 170deg, #0c0c0e 360deg); }
    .horizon-flare { position: absolute; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 110, 48, .6), #ffb790, transparent); top: 60%; width: 80%; right: -15%; box-shadow: 0 0 25px 3px rgba(255, 83, 23, .23); transform: rotate(-23deg); }
    #embers { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: .8; }
    .hero-meta { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
    .status { display: inline-flex; align-items: center; gap: 9px; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px rgba(255, 100, 54, .6); }
    .hero-meta-right { color: #aaa49a; text-align: right; font-size: 9px; }
    .hero-content { transform: translate3d(0, var(--hero-lift, 0px), 0) scale(var(--hero-scale, 1)); opacity: var(--hero-opacity, 1); transform-origin: 50% 65%; will-change: transform; }
    .hero-title { position: relative; font-size: clamp(175px, 32.7vw, 515px); font-weight: 800; letter-spacing: -.088em; line-height: .79; text-align: center; margin: clamp(36px, 5.3vh, 64px) 0 clamp(40px, 6vh, 72px); padding-right: .078em; }
    .hero-word { display: inline-block; color: var(--bone); background-image: linear-gradient(110deg, #eeece5 15%, #eeece5 37%, #fffdf3 44%, #ffb991 47%, #fff6dd 49%, #eeece5 53%, #eeece5 80%); background-size: 260% 100%; background-position: 100% 50%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: light-sweep 3.4s cubic-bezier(.18,.65,.2,1) .2s both; }
    .hero-title .registered { position: absolute; right: 1.2%; top: 9%; font-size: 17px; letter-spacing: 0; font-weight: 400; }
    .hero-bottom { display: grid; grid-template-columns: 1.2fr 1fr; gap: 60px; padding-bottom: 37px; }
    .hero-heading { font-size: clamp(29px, 3.15vw, 49px); line-height: 1.12; font-weight: 500; letter-spacing: -.045em; }
    .hero-heading .serif { font-size: 1.12em; }
    .hero-intro { display: flex; flex-direction: column; align-items: flex-start; max-width: 385px; margin-left: auto; }
    .hero-intro > p { color: #b1aca5; font-size: 13px; line-height: 1.85; max-width: 355px; }
    .hero-intro .text-link { margin-top: 12px; }
    .hero-footer { border-top: 1px solid var(--line); margin-top: auto; padding: 21px 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .scroll-cue { display: flex; align-items: center; gap: 12px; font-size: 9px; }
    .scroll-cue .icon { width: 13px; height: 13px; }
    .hero-footer-center { font-size: 8px; color: var(--muted); letter-spacing: .19em; }
    .hero-footer-right { font-size: 9px; color: var(--muted); }

    /* Scene transitions */
    .scene { position: relative; isolation: isolate; }
    .js .reveal { opacity: 0; transform: translateY(38px) scale(.985); transition: opacity 1s ease, transform 1.2s cubic-bezier(.18,.7,.23,1); }
    .js .reveal.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    .reveal.delay-1 { transition-delay: .12s; }
    .reveal.delay-2 { transition-delay: .22s; }
    .scene-line { height: 1px; background: var(--line); margin: 0 var(--gutter); }

    /* Scene 01 — a different kind of growth partner */
    .approach { padding: 145px var(--gutter) 115px; }
    .approach-grid { display: grid; grid-template-columns: 1fr 2.4fr; gap: 50px; }
    .approach-aside { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; min-height: 370px; }
    .spark { width: 60px; height: 60px; color: var(--orange); }
    .spark svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .approach h2 { font-size: clamp(40px, 5.2vw, 80px); line-height: 1.075; font-weight: 500; letter-spacing: -.055em; max-width: 960px; }
    .approach h2 .serif { font-size: 1.11em; }
    .approach-copy { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 47px; max-width: 770px; }
    .body-copy { font-size: 14px; color: #aaa7a1; line-height: 1.95; }
    .principles { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 80px; border-top: 1px solid var(--line); }
    .principle { padding: 22px 0; display: flex; gap: 16px; align-items: center; font-size: 11px; }
    .principle:not(:first-child) { padding-left: 25px; border-left: 1px solid var(--line); }
    .principle .plus { color: var(--orange); font: 20px var(--mono); }

    /* Scene 02 — the four chapters */
    .framework { padding: 105px var(--gutter) 120px; border-top: 1px solid var(--line); background: #101012; }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin: 40px 0 50px; }
    .section-heading h2 { font-size: clamp(40px, 4.5vw, 69px); font-weight: 500; line-height: 1.07; letter-spacing: -.055em; }
    .section-heading h2 .serif { font-size: 1.14em; }
    .section-heading > p { color: var(--muted); font-size: 12px; line-height: 1.9; max-width: 240px; margin-bottom: 6px; }
    .chapters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .chapter-card { width: 100%; min-width: 0; padding: 0; background: #151416; border: 1px solid #302a27; text-align: left; overflow: hidden; position: relative; display: flex; flex-direction: column; transition: border-color .4s, transform .5s; }
    .chapter-card:hover { border-color: #91503a; transform: translateY(-7px); }
    .chapter-art { height: clamp(210px, 21vw, 320px); position: relative; overflow: hidden; background: #160e0c; width: 100%; }
    .js .chapter-art { clip-path: inset(0 100% 0 0); transition: clip-path 1.35s cubic-bezier(.2,.75,.2,1); transition-delay: var(--chapter-delay, 0s); }
    .js .chapter-card.is-visible .chapter-art { clip-path: inset(0 0 0 0); }
    .chapter-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,7,8,.2), transparent 40%, rgba(14,11,12,.35)); z-index: 3; }
    .chapter-topline { position: absolute; top: 19px; left: 20px; right: 20px; display: flex; justify-content: space-between; font: 8px var(--mono); letter-spacing: .13em; color: #b99c8b; z-index: 4; }
    .art-object { position: absolute; transition: transform 1.5s cubic-bezier(.2,.65,.2,1); }
    .chapter-card:hover .art-object { transform: scale(1.06) rotate(5deg); }
    .art-alignment { background: radial-gradient(ellipse at 50% 100%, #97351c, #28120e 47%, #130f10 85%); }
    .alignment-rings { width: 75%; aspect-ratio: 1; left: 12.5%; top: 19%; border-radius: 50%; border: 1px solid #ffbd7c; box-shadow: 0 0 22px #f0522833, inset 0 0 25px #f0522822; }
    .alignment-rings::before, .alignment-rings::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid #e0804b; }
    .alignment-rings::before { inset: 15%; box-shadow: 0 0 18px #f0522844; }
    .alignment-rings::after { inset: 32%; background: radial-gradient(circle, #ffb78444, transparent 75%); }
    .alignment-axis { position: absolute; width: 1px; height: 120%; background: linear-gradient(transparent, #ffbf8077, transparent); left: 50%; top: -10%; transform: rotate(35deg); }
    .alignment-axis::after { content: ""; position: absolute; width: 100%; height: 100%; background: inherit; transform: rotate(90deg); }
    .art-engine { background: radial-gradient(ellipse at 85% 80%, #832812, #27110d 42%, #120e0f 85%); }
    .engine-lines { width: 125%; height: 60%; top: 28%; left: -8%; transform: rotate(-35deg); background: repeating-linear-gradient(0deg, transparent 0, transparent 15px, #eb652f 16px, #ffbd77 17px, #85371a 18px, transparent 20px); -webkit-mask-image: linear-gradient(90deg, transparent, black 35%, black 70%, transparent); mask-image: linear-gradient(90deg, transparent, black 35%, black 70%, transparent); }
    .chapter-card:hover .engine-lines { transform: scale(1.12) rotate(-35deg) translateX(8px); }
    .engine-glow { position: absolute; width: 80%; height: 10px; left: 20%; top: 52%; background: #ff9655; filter: blur(27px); transform: rotate(-35deg); }
    .art-leader { background: radial-gradient(ellipse at 50% 90%, #7d2b19, #28130f 40%, #110e10 85%); }
    .leader-sphere { width: 52%; aspect-ratio: 1; left: 24%; top: 23%; border-radius: 50%; background: radial-gradient(circle at 67% 22%, #ffc293 0%, #e77840 9%, #9e3a21 27%, #301410 55%, #130d0d 75%); box-shadow: 8px -7px 22px #ff76332b, 0 40px 50px -25px #eb5b35; }
    .leader-floor { position: absolute; left: 17%; bottom: 12%; width: 66%; height: 15%; border: 1px solid #8a412b; border-radius: 50%; box-shadow: 0 0 35px #e75c251a, inset 0 0 30px #e75c251a; }
    .art-frontier { background: linear-gradient(180deg, #140e10 0%, #2d130e 45%, #e76028 67%, #f0a56a 68%, #351914 69%, #120e0e 93%); }
    .frontier-grid { width: 200%; height: 60%; bottom: -16%; left: -50%; background-image: linear-gradient(#d7794433 1px, transparent 1px), linear-gradient(90deg, #d7794433 1px, transparent 1px); background-size: 35px 23px; transform: perspective(130px) rotateX(48deg); }
    .chapter-card:hover .frontier-grid { transform: perspective(130px) rotateX(48deg) translateY(-8px); }
    .frontier-sun { position: absolute; width: 47%; aspect-ratio: 1; left: 26.5%; top: 23%; border: 1px solid #eda271; border-radius: 50%; background: linear-gradient(180deg, transparent, #fd935631); box-shadow: 0 0 40px #f26d241c; }
    .chapter-body { padding: 24px 20px 21px; display: flex; flex-direction: column; flex: 1; }
    .chapter-title { font-size: clamp(14px, 1.28vw, 21px); font-weight: 600; letter-spacing: -.025em; display: flex; gap: 8px; align-items: baseline; }
    .chapter-title .chapter-num { color: #af7861; font: 9px var(--mono); letter-spacing: 0; }
    .chapter-description { color: var(--muted); font-size: 11px; line-height: 1.85; margin-top: 14px; min-height: 60px; }
    .chapter-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; }
    .chapter-bottom > span:first-child { color: #c2b8ad; font: 8px var(--mono); text-transform: uppercase; letter-spacing: .1em; }
    .chapter-plus { display: grid; place-items: center; border: 1px solid #4c3830; border-radius: 50%; height: 27px; width: 27px; font: 17px var(--mono); transition: background .3s, color .3s, transform .4s; }
    .chapter-card:hover .chapter-plus { background: var(--orange); color: var(--ink); border-color: var(--orange); transform: rotate(90deg); }
    .framework-caption { display: flex; justify-content: space-between; gap: 20px; margin-top: 28px; color: #74716b; font-size: 8px; }

    /* Scene 03 — the moving picture */
    .film-section { position: relative; background: var(--ink); }
    .film-stage { padding: 95px 0 75px; overflow: hidden; }
    .js .film-section.is-horizontal .film-stage { position: sticky; top: 0; height: 100svh; min-height: 650px; padding-top: clamp(54px, 9vh, 110px); padding-bottom: 45px; display: flex; flex-direction: column; justify-content: center; }
    .film-heading { padding: 0 var(--gutter); }
    .film-heading .section-heading { margin: 28px 0 35px; }
    .film-heading h2 { font-size: clamp(37px, 4.1vw, 65px); }
    .film-heading .section-heading > p { max-width: 185px; font-size: 11px; }
    .film-window { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: grab; touch-action: pan-y; }
    .film-window::-webkit-scrollbar { display: none; }
    .is-horizontal .film-window { overflow: hidden; }
    .film-window.is-dragging, .film-window.is-dragging * { cursor: grabbing !important; user-select: none; }
    .film-track { display: flex; gap: 26px; padding: 16px var(--gutter); width: max-content; transform: translate3d(var(--film-x, 0px), 0, 0); will-change: transform; position: relative; }
    .film-track::before, .film-track::after { content: ""; position: absolute; height: 5px; left: 0; right: 0; background: repeating-linear-gradient(90deg, #5b5044 0 9px, transparent 9px 25px); opacity: .65; }
    .film-track::before { top: 0; }
    .film-track::after { bottom: 0; }
    .film-card { display: block; position: relative; width: clamp(360px, 56vw, 870px); height: clamp(270px, 42vh, 470px); overflow: hidden; border: 1px solid #48372e; text-align: left; background: #211b18; padding: 0; flex-shrink: 0; isolation: isolate; }
    .film-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.45) brightness(.64); transition: transform 1.5s cubic-bezier(.2,.65,.2,1), filter .7s; z-index: -3; pointer-events: none; }
    .film-card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,12,12,.1), rgba(15,12,11,.05) 30%, rgba(12,10,10,.87)), linear-gradient(120deg, rgba(130,49,22,.25), transparent); z-index: -1; }
    .film-card:hover img { transform: scale(1.04); filter: saturate(.65) brightness(.8); }
    .film-card-top { position: absolute; top: 23px; left: 29px; right: 29px; display: flex; justify-content: space-between; font-size: 8px; color: #d4c6b6; }
    .film-card-content { position: absolute; bottom: 30px; left: 32px; right: 32px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .film-card-category { font-size: 8px; color: #e7b99e; margin-bottom: 14px; }
    .film-card h3 { font-size: clamp(30px, 3vw, 45px); font-weight: 500; letter-spacing: -.04em; line-height: 1.08; max-width: 520px; }
    .film-card h3 .serif { font-size: 1.15em; }
    .film-card .round-arrow { border-color: #9a897b; flex-shrink: 0; }
    .film-card:hover .round-arrow { background: var(--bone); color: var(--ink); border-color: var(--bone); }
    .film-controls { padding: 24px var(--gutter) 0; display: flex; align-items: center; justify-content: space-between; gap: 35px; }
    .film-count { font: 10px var(--mono); white-space: nowrap; display: flex; gap: 12px; }
    .film-count .total { color: #65635e; }
    .film-progress { height: 1px; background: var(--line); flex: 1; max-width: 630px; }
    .film-progress-fill { width: 33.333%; height: 1px; background: var(--orange); transform-origin: left; transition: width .1s linear; }
    .film-drag-label { color: #969087; font-size: 8px; white-space: nowrap; }
    .film-arrows { display: flex; gap: 8px; }
    .film-arrows button { width: 37px; height: 37px; background: transparent; border: 1px solid #48443e; border-radius: 50%; display: grid; place-items: center; transition: background .25s, color .25s, opacity .25s; }
    .film-arrows button:hover:not(:disabled) { background: var(--bone); color: var(--ink); }
    .film-arrows button:disabled { opacity: .25; }
    .film-arrows .icon { width: 15px; height: 15px; }

    /* Scene 04 — the conviction */
    .conviction { min-height: 770px; min-height: 88svh; padding: 110px var(--gutter); overflow: hidden; display: flex; justify-content: center; align-items: center; text-align: center; border-top: 1px solid #512a1d; border-bottom: 1px solid #512a1d; }
    .conviction-atmosphere { position: absolute; z-index: -2; inset: -15%; background: radial-gradient(ellipse at 50% 110%, #ff8741 0%, #b53618 20%, #6e1e13 38%, #27120f 57%, #100e0f 77%); animation: ken-burns 25s ease-in-out infinite alternate; }
    .conviction-atmosphere::after { content: ""; position: absolute; width: 85%; aspect-ratio: 1; left: 7.5%; top: 68%; border: 1px solid rgba(255, 197, 133, .38); box-shadow: 0 -15px 80px #ff6c202b; border-radius: 50%; }
    .conviction-content { max-width: 1120px; position: relative; }
    .conviction .section-tag { justify-content: center; font-size: 9px; color: #c69b85; }
    .quote-mark { font: italic 110px/.8 var(--serif); color: var(--orange); margin-top: 54px; height: 55px; }
    .conviction blockquote { padding: 0; margin: 13px 0 35px; font-size: clamp(40px, 6.1vw, 92px); font-weight: 500; letter-spacing: -.055em; line-height: 1.06; }
    .conviction blockquote .serif { font-size: 1.15em; }
    .conviction-description { max-width: 440px; margin: 0 auto; font-size: 12px; line-height: 1.9; color: #c8b6a9; }
    .conviction-signature { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 47px; font-size: 8px; color: #cbb2a1; }
    .conviction-signature::before { content: ""; height: 1px; width: 24px; background: #d9a184; }

    /* Scene 05 — the next chapter */
    .contact { padding: 115px var(--gutter) 80px; overflow: hidden; }
    .contact-top { display: flex; align-items: center; justify-content: space-between; }
    .contact-availability { font-size: 8px; color: #a6a199; }
    .contact-main { display: flex; align-items: center; justify-content: space-between; gap: 50px; margin-top: 47px; }
    .contact h2 { font-size: clamp(64px, 9.4vw, 148px); line-height: .96; letter-spacing: -.065em; font-weight: 500; }
    .contact h2 .serif { font-size: 1.15em; }
    .contact-button { width: clamp(110px, 15vw, 220px); height: clamp(110px, 15vw, 220px); border: 1px solid #a35335; border-radius: 50%; color: var(--orange); background: radial-gradient(circle at 70% 80%, #2a130d, transparent 75%); display: grid; place-items: center; transition: background .4s, color .4s, transform .5s; flex-shrink: 0; }
    .contact-button .icon { width: 40%; height: 40%; stroke-width: .9; transition: transform .5s; }
    .contact-button:hover { background: var(--orange); color: var(--ink); transform: rotate(5deg); }
    .contact-button:hover .icon { transform: translate(5px, -5px); }
    .contact-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 55px; gap: 30px; }
    .contact-bottom p { color: #aaa49b; font-size: 12px; line-height: 1.9; }
    .contact-bottom .text-link { font-size: 18px; font-weight: 400; letter-spacing: -.025em; }
    .footer { margin: 0 var(--gutter); padding: 32px 0 78px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; gap: 25px; }
    .footer-brand { display: flex; align-items: center; gap: 22px; }
    .footer-brand .brand { font-size: 26px; }
    .footer-brand p { font-size: 7px; color: var(--muted); }
    .footer-center { font-size: 8px; text-align: center; color: #6e6b65; }
    .back-to-top { display: flex; align-items: center; gap: 16px; justify-self: end; font-size: 8px; color: #aaa49b; }
    .back-to-top .icon { width: 13px; height: 13px; }

    /* The running time */
    .timecode { position: fixed; bottom: 20px; right: 23px; z-index: 35; display: flex; gap: 15px; align-items: center; background: rgba(12,12,14,.76); padding: 10px 12px; border: 1px solid rgba(166,137,112,.24); backdrop-filter: blur(14px); pointer-events: none; }
    .timecode-scene { font: 7px var(--mono); letter-spacing: .08em; color: #979186; padding-right: 12px; border-right: 1px solid #403830; }
    .timecode-running { display: flex; align-items: center; gap: 8px; }
    .timecode-light { width: 4px; height: 4px; background: var(--orange); border-radius: 50%; }
    .timecode-value { font: 10px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    .timecode-track { position: absolute; bottom: -1px; left: 0; width: 100%; height: 1px; background: var(--orange); transform: scaleX(var(--page-progress, 0)); transform-origin: left; }

    /* Chapter and conversation overlays */
    dialog { color: var(--bone); background: #141214; border: 1px solid #5e392a; padding: 0; width: min(740px, calc(100% - 36px)); max-height: calc(100svh - 48px); overscroll-behavior: contain; }
    dialog::backdrop { background: rgba(5,5,7,.87); backdrop-filter: blur(13px); }
    dialog[open] { animation: dialog-in .5s cubic-bezier(.16,.8,.25,1) both; }
    .dialog-close { position: absolute; top: 21px; right: 22px; display: grid; place-items: center; width: 35px; height: 35px; border: 1px solid #5b463a; border-radius: 50%; background: rgba(12,12,14,.65); z-index: 3; transition: background .2s; }
    .dialog-close:hover { background: #7b321d; }
    .dialog-close .icon { width: 15px; height: 15px; }
    .story-visual { height: 190px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 65% 110%, #fa8f4f, #a9391d 25%, #361710 55%, #141214 85%); }
    .story-visual::before { content: ""; position: absolute; height: 380px; width: 380px; border: 1px solid #df9666; border-radius: 50%; left: 40%; top: 20%; box-shadow: 0 0 60px #c4482230; }
    .story-visual-label { position: absolute; left: 42px; bottom: 25px; font-size: 9px; color: #edc6aa; }
    .dialog-body { padding: 37px 42px 42px; }
    .dialog-body h2 { font-size: clamp(30px, 4vw, 45px); font-weight: 500; line-height: 1.13; letter-spacing: -.045em; max-width: 590px; }
    .dialog-body .dialog-intro { margin-top: 22px; font: italic 24px/1.4 var(--serif); color: #d0b6a3; }
    .dialog-prose { color: #b0a79d; font-size: 13px; line-height: 1.95; }
    .dialog-prose p { margin-top: 23px; }
    .dialog-prose h3 { color: var(--bone); font-size: 17px; letter-spacing: -.025em; font-weight: 500; margin-top: 29px; }
    .dialog-deliverables { margin: 25px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .dialog-deliverables li { display: flex; align-items: center; gap: 15px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: #bcb1a6; }
    .dialog-deliverables li::before { content: "+"; color: var(--orange); font: 15px var(--mono); }
    .dialog-cta { border: none; background: var(--orange); color: #1a0f0b; padding: 16px 20px; display: inline-flex; align-items: center; justify-content: space-between; gap: 30px; font-size: 12px; font-weight: 600; margin-top: 30px; transition: background .2s; }
    .dialog-cta:hover { background: #ff895c; }
    .dialog-cta .icon { width: 16px; height: 16px; }
    .contact-dialog { width: min(640px, calc(100% - 36px)); }
    .contact-dialog .dialog-body { padding-top: 53px; background: radial-gradient(ellipse at 100% 0%, #49201055, transparent 55%); }
    .contact-dialog h2 { margin-top: 24px; font-size: 43px; }
    .contact-dialog .form-description { font-size: 12px; color: var(--muted); line-height: 1.8; margin-top: 15px; }
    .contact-form { margin-top: 27px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 20px; }
    .form-field { display: flex; flex-direction: column; gap: 10px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { color: #bbafa2; font: 8px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .form-field input, .form-field select, .form-field textarea { color: var(--bone); background: #1b1818; border: 1px solid #41352f; width: 100%; padding: 13px; font-size: 12px; }
    .form-field input::placeholder, .form-field textarea::placeholder { color: #706861; }
    .form-field select { color-scheme: dark; }
    .form-field textarea { resize: vertical; min-height: 86px; }
    .contact-form .dialog-cta { width: 100%; margin-top: 24px; }
    .form-note { color: #787168; font-size: 9px; line-height: 1.7; margin-top: 13px; }
    .form-status { margin-top: 19px; padding: 16px; border: 1px solid #895136; background: #38221644; color: #dfc4ae; font-size: 12px; line-height: 1.9; }
    .form-status a { text-decoration: underline; text-underline-offset: 3px; }

    @keyframes light-sweep { from { background-position: 100% 50%; filter: brightness(.65); } to { background-position: 0% 50%; filter: brightness(1); } }
    @keyframes ray-drift { from { transform: rotate(-29deg) translateY(-15px) scaleY(.8); opacity: .5; } to { transform: rotate(-21deg) translateY(40px) scaleY(1.3); opacity: .9; } }
    @keyframes ken-burns { from { transform: scale(1) translateY(0); } to { transform: scale(1.14) translateY(-3%); } }
    @keyframes dialog-in { from { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateY(18px); } to { opacity: 1; clip-path: inset(0); transform: translateY(0); } }

    @media (min-width: 1700px) {
      .hero { min-height: min(1040px, calc(100svh - 88px)); }
      .hero-content { max-width: 1510px; width: 100%; margin: 0 auto; }
      .hero-title { font-size: 545px; }

      .hero-intro { margin-left: 0; max-width: 330px; }

      .hero-footer { padding: 19px 0; }
      .hero-footer-center { display: none; }
